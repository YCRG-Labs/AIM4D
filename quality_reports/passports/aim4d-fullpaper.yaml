  - id: C21
    claim: "Symmetric channel ablation: leave-one-block-out OOS AUC deltas of -0.007 (DSP, 20 cols), -0.042 (mobilization, 8 cols), -0.033 (latent factor, 91 cols); AUC-PR deltas -0.010 / -0.097 / -0.146; block-only OOS AUC 0.776 / 0.774 / 0.843 against a full-set 0.904"
    location: "fullpaper.tex:Section 5.1 + abstract + intro + Section 8.1 + conclusion + Appendix H Table 17"
    source_file: robustness/channel_ablation.py
    output_file: robustness/channel_ablation.csv
    output_field: "auc_roc_oos / auc_pr_oos by configuration; delta_ablate_* rows"
    tolerance: {point_estimate: 0.005}
    last_verified_on: 2026-09-03T00:00:00Z
    last_verified_by: "/audit-reproducibility"
    status: PASS
    notes: |
      Added to answer the one-sided-ablation objection: dsp_ablation.py (C11)
      shows removing the DSP block is cheap but never tests whether removing
      any other block is dearer. This runs the identical protocol over three
      blocks on one fit. It reproduces C11's shared configurations to within
      0.002 (full 0.9042 vs 0.9051, ablate_dsp 0.8977 vs 0.8989, dsp_only
      0.7762 vs 0.7743), which is inside C11's own 0.005 tolerance; the small
      drift is a scikit-learn version difference (run under 1.9.0). Both
      tables are cited in the paper and are read together, not as competing
      estimates of the same quantity.

  - id: C22
    claim: "Locked-spec state sweep: weighted kappa 0.574/0.647/0.718/0.699 and unweighted 0.444/0.479/0.500/0.387 for S=3..6, both peaking at S=5; S=5 reproduces the pipeline kappa of 0.72; bare sanity-check fit returns 0.58"
    location: "fullpaper.tex:Section 4.3 + Section 6.1 + Section 6.6 + Table 13"
    source_file: robustness/hmm_states_locked.py + robustness/k_sensitivity.py + robustness/sanity_checks.py
    output_file: robustness/hmm_states_locked_results.csv + robustness/k_sensitivity_results.csv + robustness/sanity_checks_results.csv
    output_field: "kappa_w / kappa by S in hmm_states_locked_results.csv; weighted_kappa at K=4 (0.7151); hmm_kappa_real (0.5807)"
    tolerance: {point_estimate: 0.005}
    last_verified_on: 2026-09-03T00:00:00Z
    last_verified_by: "/audit-reproducibility"
    status: PASS
    notes: |
      RESOLVED at source on 2026-09-03. The earlier hmm_states.py sweep differed
      from the pipeline in four ways (full rather than diagonal covariance, 20
      rather than 60 restarts, no stabilization filter, and a fit on the whole
      panel rather than the pre-2019 training window), which is why it returned
      0.67 at S=5 against the pipeline's 0.72. hmm_states_locked.py re-runs the
      sweep under the locked specification and returns 0.718 at S=5, reproducing
      the headline. It also strengthens the state-count argument: under the
      locked spec BOTH weighted and unweighted kappa peak at S=5 and fall at
      S=6, where the old sweep had weighted kappa rising monotonically to S=6.
      Table 13 now reports the locked sweep. hmm_states.py and its CSV are kept
      on disk as superseded provenance and are no longer cited in the paper.
      The 0.58 sanity-check figure is a deliberately stripped 8-restart fit
      whose purpose is real-vs-scrambled contrast, and stays as disclosed.
