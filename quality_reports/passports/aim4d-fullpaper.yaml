  - id: C24
    claim: "Directional mobilization sub-blocks: leave-one-out OOS AUC deltas -0.009 (pro-democratic, 2 cols), -0.021 (pro-autocratic, 2 cols), -0.002 (general/concentration, 4 cols); AUC-PR deltas -0.057 / -0.065 / -0.033; block-only OOS AUC 0.714 / 0.631 / 0.644"
    location: "fullpaper.tex:Section 5.2 + Appendix H Table 17"
    source_file: robustness/channel_ablation.py
    output_file: robustness/channel_ablation.csv
    output_field: "auc_roc_oos / auc_pr_oos for ablate_mobdem, ablate_mobaut, ablate_mobgen and *_only rows"
    tolerance: {point_estimate: 0.005}
    last_verified_on: 2026-09-03T00:00:00Z
    last_verified_by: "/audit-reproducibility"
    status: PASS
    notes: |
      Added to answer Kang and Petrova (2024), who find pro-government mass
      action is most likely in the aftermath of anti-government protest, which
      would make one component of the pooled mobilization block downstream of
      another and the pooled signal a reaction rather than a precursor. Both
      directional sub-blocks are load-bearing and each costs more to remove
      than the whole 20-column DSP block; the undirected volume measures cost
      almost nothing. Sub-block deltas sum to -0.032 against the pooled -0.042,
      so they are complementary rather than duplicative. This does NOT order
      pro-autocratic against pro-democratic mobilization within the pre-onset
      window; annual resolution cannot settle that and the paper says so.

  - id: C25
    claim: "Symmetric winsorization is free: LOEO 32/18/12 of 46 unchanged; 2019 hold-out AUC 0.9345 -> 0.9361, AP 0.6560 -> 0.6618; only 90 of 7394 beta rows change"
    location: "fullpaper.tex:Section 4.2 + robustness discussion"
    source_file: stage2_betas/estimate.py (AIM4D_WINSOR_MODE=symmetric, now the default)
    output_file: stage2_betas/country_year_betas.csv + stage5_ews/loeo_results.csv + robustness/bootstrap_cis.csv
    output_field: "beta columns; detected_watch/warning/alert sums; auc_roc_oos_2019 / auc_pr_oos_2019"
    tolerance: {point_estimate: 0.005, n: exact}
    last_verified_on: 2026-09-04T00:00:00Z
    last_verified_by: "manual run at creation"
    status: PASS
    notes: |
      Adopted 2026-09-04. The prior upper-tail-only rule was defended on the
      claim that positive excursions arise from a small contemporaneous global
      change; measurement reverses that (mean |leave-one-out global change| is
      0.107 in 1989-92, 4.7x the panel mean, versus 0.014 in 2009-11, 0.6x), so
      the small-denominator mechanism describes the RETAINED tail. Symmetric
      clipping costs only the Hungary beta trajectory reading, which is clipped
      to the -2.811 bound; no result depends on it. Upper-winsorized artifacts
      are archived at /tmp/aim4d_upper_backup (not durable - regenerate with
      AIM4D_WINSOR_MODE=upper if needed).

  - id: C26
    claim: "Election lookahead removed: election_within_2yr window changed from centered to backward; regenerated 2026-09-05 against the retrained Stage 4, giving 2019 hold-out AUC 0.9388, AP 0.5915, BSS 0.2124; LOEO watch 35, warning 22, alert 12 of 46"
    location: "fullpaper.tex:Section 4.5 + Section 5.6 + Table 3"
    source_file: stage5_ews/estimate.py (AIM4D_ELECTION_WINDOW, default backward)
    output_file: stage5_ews/ews_signals.csv + stage5_ews/loeo_results.csv + robustness/bootstrap_cis.csv
    output_field: "calibrated_risk on year>2019; detected_watch/warning/alert sums"
    tolerance: {point_estimate: 0.005, n: exact}
    last_verified_on: 2026-09-04T00:00:00Z
    last_verified_by: "manual run at creation"
    status: PASS
    notes: |
      A centered 3-year rolling max let year t see an election at t+1. Verified
      independently: of the 689 country-years whose only election in {t-1,t,t+1}
      falls at t+1, 689 of 689 carried nonzero election_vulnerability. The
      stored election_within_2yr column was already overwritten with a correct
      backward version further down the file, so only the product
      election_vulnerability = party_threat x indicator retained the lookahead.
      Removing it leaves the headline discrimination unchanged (AUC marginally
      up) and shifts LOEO detection toward the higher tiers. Set
      AIM4D_ELECTION_WINDOW=centered to reproduce the prior behaviour.

